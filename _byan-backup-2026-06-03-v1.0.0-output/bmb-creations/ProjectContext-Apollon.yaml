# PROJECT CONTEXT - APOLLON
# Application mobile Flutter de suivi de musculation
# Generated by BYAN-TEST on 2026-02-15

project_name: "apollon"
project_description: "Application mobile Flutter pour le suivi de progression en musculation en salle de sport"
domain: "Fitness / Musculation"
subdomain: "Suivi de performance sportive"

# ==========================================
# CONTEXTE PROJET
# ==========================================

context:
  maturity_level: "idea"
  timeline: "3 mois"
  budget_time: "2-3h/semaine (≈36h total)"
  methodology: "Agile"
  team:
    size: 1
    composition: "Solo developer"
    skills:
      - "Flutter/Dart: Intermédiaire (1 app complète réalisée)"
      - "Firebase: Débutant (première utilisation)"
    profile: "Développeur solo, apprentissage Firebase, focus qualité design"

# ==========================================
# PROBLÉMATIQUE & MOTIVATION
# ==========================================

problem:
  description: "Oubli fréquent des poids utilisés lors des séances de musculation"
  current_solution: "Tâtonnement à chaque exercice pour retrouver le bon poids"
  pain_points:
    - "Perte de temps à chaque séance"
    - "Progression sous-optimale (manque de traçabilité)"
    - "Frustration liée à l'imprécision"
  root_cause: "Absence d'outil de suivi adapté avec design premium"

motivation:
  functional: "Apps existantes ont un design peu attractif"
  personal: "Monter en compétence sur développement mobile Flutter + Firebase"
  goal: "Créer une solution personnelle belle, fluide et intuitive"

# ==========================================
# STACK TECHNIQUE
# ==========================================

stack_tech:
  frontend:
    - "Flutter/Dart"
    - "State Management: Provider (recommandé pour V1)"
  backend:
    - "Firebase Authentication (Google Sign-In)"
    - "Cloud Firestore (base de données)"
  platforms:
    - "Android (prioritaire)"
    - "iOS (secondaire/bonus)"
  infrastructure:
    - "Firebase (plan gratuit pour démarrage)"
  constraints:
    - "Pas de contraintes de performance spécifiques"
    - "Offline-first avec synchronisation Firebase"

# ==========================================
# DESIGN SYSTEM
# ==========================================

design_system:
  style: "Modern Liquid Glass (inspiration Apple glassmorphism)"
  characteristics:
    - "Arrondis prononcés"
    - "Effets de transparence et flou"
    - "Animations fluides 60fps minimum"
  modes:
    - "Mode sombre (obligatoire V1)"
    - "Mode clair (obligatoire V1)"
  color_palette: "À définir (cohérence globale requise)"
  typography: "À définir (police cohérente globalement)"
  icons_v1: "Emojis adaptés par catégorie d'exercice"
  images_v2: "Images générées par IA (reporté à V2)"
  principles:
    - "NO EMOJI dans code source, commits, documentation technique"
    - "Emojis autorisés uniquement dans communication conversationnelle"

# ==========================================
# GLOSSAIRE MÉTIER (6 concepts)
# ==========================================

glossaire:
  exercice:
    definition: "Mouvement de musculation lié à un équipement ou une machine spécifique avec sa variante"
    exemples:
      - "Développé couché à la barre"
      - "Smith Machine"
      - "Hack Squat"
      - "Pompes (poids corporel)"
    attributs:
      - "Nom unique"
      - "Lié à un équipement/machine précis"
      - "Chaque variante = exercice distinct"
    relations:
      - "Appartient à un ou plusieurs Groupes Musculaires"
      - "Possède un Type d'Exercice"
      - "Contient plusieurs Séries dans une Séance"

  groupe_musculaire:
    definition: "Zone anatomique ciblée par un exercice de musculation"
    exemples:
      - "Pectoraux"
      - "Biceps"
      - "Triceps"
      - "Abdominaux"
      - "Quadriceps"
      - "Fessiers"
      - "Dorsaux"
      - "Épaules"
    caracteristiques:
      - "Un exercice peut cibler plusieurs groupes musculaires simultanément"
      - "Exemple: Développé couché → Pectoraux + Triceps"
      - "Exemple: Squat → Quadriceps + Fessiers + Ischio-jambiers"
    usage: "Système de navigation principal pour sélectionner exercices"

  type_exercice:
    definition: "Nature de l'équipement ou modalité d'exécution de l'exercice"
    valeurs:
      - "Poids libres (barres, haltères)"
      - "Machine guidée"
      - "Poids corporel"
      - "Cardio"
    importance: "Système de navigation secondaire (filtrage complémentaire)"
    relation: "Un exercice possède un Type principal"

  serie:
    definition: "Ensemble de répétitions continues effectuées sans pause pour un exercice donné"
    attributs:
      nombre_repetitions:
        type: "Entier"
        validation: "> 0"
        exemple: "12 répétitions"
      poids_kg:
        type: "Décimal"
        validation: "≥ 0"
        unite: "kilogrammes"
        exemple: "80.0 kg"
        note: "0 kg = poids corporel"
    creation: "Bouton 'Ajouter une série' → saisie répétitions + poids"
    relation: "Une série est toujours liée à UN exercice dans UNE séance"

  seance:
    definition: "Session complète d'entraînement à la salle de sport"
    attributs:
      date:
        type: "Date"
        obligatoire: true
        format: "ISO 8601"
      duree_totale:
        type: "Durée"
        obligatoire: false
        note: "V2 avec chronomètre global"
        unite: "minutes"
    contenu: "Liste d'exercices, chacun contenant plusieurs séries"
    hierarchie: "SÉANCE → EXERCICES → SÉRIES (répétitions + poids)"
    historique: "Toutes les séances sont conservées pour statistiques futures et calendrier"
    workflow:
      - "Démarrage: Bouton 'Nouvelle séance'"
      - "Ajout exercices et séries"
      - "Finalisation: Bouton 'Terminer la séance' → Sauvegarde Firestore"

  utilisateur:
    definition: "Personne utilisant l'application (pratiquant de musculation)"
    authentification: "Connexion obligatoire via compte Google"
    donnees_associees:
      - "Historique complet de séances"
      - "Préférences (futures: unité kg/lbs, exercices favoris)"
    permissions:
      - "CRUD sur ses propres données (séances, exercices, séries)"
      - "Isolation complète: aucun accès aux données des autres utilisateurs"

# ==========================================
# ACTEURS
# ==========================================

acteurs:
  - name: "Utilisateur authentifié"
    type: "external"
    description: "Pratiquant de musculation utilisant l'app pour suivre ses performances"
    permissions:
      - "Créer, lire, mettre à jour, supprimer ses séances"
      - "Ajouter/modifier/supprimer exercices dans ses séances"
      - "Ajouter/modifier/supprimer séries dans ses exercices"
      - "Consulter son historique complet"
    contraintes:
      - "Accès uniquement à ses propres données (isolation utilisateur)"
      - "Authentification Google obligatoire"

  - name: "Google Auth"
    type: "system"
    description: "Système externe de gestion d'authentification"
    responsabilite: "Authentification et gestion des sessions utilisateur"
    integration: "Firebase Authentication"

# ==========================================
# PROCESSUS MÉTIER (3 principaux)
# ==========================================

processus_metier:
  - id: "P1"
    name: "Première connexion"
    description: "Onboarding utilisateur avec authentification Google"
    criticity: "high"
    steps:
      - "Utilisateur lance l'application"
      - "Écran de connexion Google affiché"
      - "Utilisateur s'authentifie via compte Google"
      - "Authentification réussie → Redirection vers écran d'accueil"
    regles_appliquees:
      - "RG-001"

  - id: "P2"
    name: "Enregistrer une séance"
    description: "Processus principal - Saisie des exercices et séries lors d'une séance à la salle"
    criticity: "critical"
    steps:
      - step: 1
        action: "Utilisateur clique sur bouton 'Nouvelle séance'"
        resultat: "Écran de saisie de séance activé"
      - step: 2
        action: "Sélection d'un exercice"
        details:
          - "Navigation par Groupe Musculaire (pectoraux, biceps, etc.)"
          - "OU navigation par Type d'Exercice (poids libres, machine, etc.)"
          - "OU recherche par nom d'exercice"
        resultat: "Exercice sélectionné"
      - step: 3
        action: "Affichage automatique de l'historique"
        details: "Dernière séance où cet exercice a été effectué (texte simple: date + séries)"
        note: "Si première utilisation: 'Pas de séance pour l'instant'"
      - step: 4
        action: "Ajout des séries"
        details:
          - "Bouton 'Ajouter une série'"
          - "Saisie: nombre de répétitions (entier > 0)"
          - "Saisie: poids en kg (décimal ≥ 0)"
          - "Répéter pour chaque série de l'exercice"
      - step: 5
        action: "Répétition pour autres exercices"
        details: "Retour à l'étape 2 pour ajouter d'autres exercices"
      - step: 6
        action: "Finalisation de la séance"
        details: "Clic sur bouton 'Terminer la séance'"
        resultat: "Sauvegarde définitive dans Firestore"
    regles_appliquees:
      - "RG-002"
      - "RG-003"
      - "RG-004"
      - "RG-005"
      - "RG-006"
    edge_cases:
      - "EC-001"
      - "EC-002"
      - "EC-003"
      - "EC-004"

  - id: "P3"
    name: "Consulter l'historique"
    description: "Visualisation des séances passées et performances"
    criticity: "medium"
    steps:
      - "Utilisateur accède à l'historique (menu/onglet)"
      - "Liste des séances affichée (triée par date décroissante)"
      - "Sélection d'une séance"
      - "Détail affiché: exercices effectués + séries (reps + poids) pour chaque"
    note: "V2: Calendrier visuel, graphiques de progression"

# ==========================================
# RÈGLES DE GESTION (6)
# ==========================================

regles_gestion:
  - id: "RG-001"
    description: "Authentification Google obligatoire"
    priority: "critical"
    regulatory: false
    details: "Aucune donnée accessible sans connexion Google. Écran de login affiché systématiquement si non authentifié."

  - id: "RG-002"
    description: "Unicité des noms d'exercices"
    priority: "high"
    regulatory: false
    details: "Chaque exercice possède un nom unique dans la base. Pas de doublons possibles."

  - id: "RG-003"
    description: "Validation des données de série"
    priority: "high"
    regulatory: false
    validation:
      repetitions: "> 0 (entier positif)"
      poids: "≥ 0 (décimal, 0 = poids corporel)"
    details: "Validation côté client ET côté serveur (Firestore Security Rules)"

  - id: "RG-004"
    description: "Persistance de la séance en cours"
    priority: "high"
    regulatory: false
    details: |
      La séance reste active même si:
      - Application mise en arrière-plan
      - Téléphone éteint/verrouillé
      - Utilisateur change d'application
      
      Mécanismes:
      - Sauvegarde automatique continue (mode brouillon local + Firestore)
      - Brouillon conservé pendant 24h maximum
      - Notification persistante: "Séance en cours depuis X min" (V2)
      
      Finalisation uniquement via bouton "Terminer la séance"

  - id: "RG-005"
    description: "Affichage de l'historique exercice"
    priority: "medium"
    regulatory: false
    version: "V1"
    format: "Texte simple (non graphique)"
    details: |
      Lors de la sélection d'un exercice:
      - Affichage automatique de la DERNIÈRE séance où l'exercice a été effectué
      - Format: Date + liste des séries (reps × poids)
      - Exemple:
        "Dernière séance (12/02/2026):
         • Série 1: 12 reps × 80kg
         • Série 2: 10 reps × 80kg
         • Série 3: 8 reps × 82.5kg"
      
      V2: Graphiques de progression (poids vs répétitions)

  - id: "RG-006"
    description: "Sauvegarde finale de la séance"
    priority: "critical"
    regulatory: false
    details: "La séance n'est finalisée et définitivement sauvegardée que lors du clic sur 'Terminer la séance'. Avant cela, elle reste en mode brouillon."

# ==========================================
# EDGE CASES (4)
# ==========================================

edge_cases:
  - id: "EC-001"
    name: "Première utilisation d'un exercice"
    scenario: "Utilisateur sélectionne un exercice jamais effectué auparavant"
    comportement: "Affichage du message 'Pas de séance pour l'instant'"
    priority: "medium"

  - id: "EC-002"
    name: "Séance jamais terminée (brouillon abandonné)"
    scenario: "Utilisateur démarre une séance puis ferme l'app sans cliquer sur 'Terminer'"
    comportement: |
      - Conservation du brouillon pendant 24h
      - Au-delà de 24h: Suppression automatique OU dialogue "Reprendre séance du XX/XX ?"
      - Option: Supprimer manuellement le brouillon
    priority: "medium"

  - id: "EC-003"
    name: "Perte de connexion internet"
    scenario: "Utilisateur perd la connexion pendant une séance ou consultation"
    comportement: |
      - Mode offline natif de Firestore activé
      - Données sauvegardées localement dans le cache
      - Synchronisation automatique au retour de la connexion
      - Indicateur visuel "Mode hors ligne" (optionnel)
    complexite: "Faible (intégré à Firebase)"
    priority: "high"

  - id: "EC-004"
    name: "Suppression de données"
    scenario: "Utilisateur veut supprimer une séance, un exercice ou une série"
    comportement: |
      Niveaux de suppression:
      - Suppression d'une SÉRIE dans un exercice: Confirmation "Supprimer cette série ?"
      - Suppression d'un EXERCICE dans une séance: Confirmation "Supprimer cet exercice et toutes ses séries ?"
      - Suppression d'une SÉANCE complète: Confirmation "Supprimer cette séance définitivement ?"
      
      V1: Suppression définitive (pas d'undo)
      V2: Corbeille avec récupération possible
    priority: "medium"

# ==========================================
# CRITÈRES DE SUCCÈS V1
# ==========================================

success_criteria:
  - id: "CS-001"
    criterion: "Efficacité de saisie"
    target: "Saisir une séance complète (5 exercices) en moins de 2 minutes"
    mesure: "Chronomètre test utilisateur"
    priority: "critical"

  - id: "CS-002"
    criterion: "Performance de récupération"
    target: "Retrouver les derniers poids utilisés pour un exercice en moins de 1 seconde"
    mesure: "Temps de chargement écran exercice"
    priority: "critical"

  - id: "CS-003"
    criterion: "Qualité UX"
    target: "Interface fluide, belle et intuitive - utilisation sans frustration"
    mesure: "Test utilisateur qualitatif + fluidité 60fps"
    priority: "high"

# ==========================================
# ROADMAP V1 vs V2+
# ==========================================

roadmap:
  v1_mvp:
    description: "Version Minimum Viable Product"
    timeline: "3 mois"
    features:
      - "Connexion Google Auth"
      - "Navigation exercices (Groupe Musculaire + Type)"
      - "Saisie séries (répétitions + poids)"
      - "Historique texte simple (dernière séance par exercice)"
      - "Sauvegarde séance (bouton Terminer)"
      - "Mode sombre + clair"
      - "Design System Liquid Glass (avec emojis)"
      - "Liste exercices seed (~50 exercices prédéfinis)"
      - "Mode offline (Firestore natif)"

  v1_5_nice_to_have:
    description: "Améliorations si temps restant"
    features:
      - "Notification persistante séance en cours"
      - "Graphiques basiques avec fl_chart"

  v2_future:
    description: "Fonctionnalités avancées reportées"
    features:
      - "Chronomètre global de session"
      - "Chronomètre par exercice"
      - "Graphiques de progression avancés"
      - "Statistiques complètes"
      - "Calendrier visuel des séances"
      - "Images exercices (générées par IA)"
      - "Ajout exercices personnalisés par utilisateur"
      - "Import/Export données"
      - "Corbeille avec récupération"
      - "Intégrations (montres connectées, balance)"

# ==========================================
# DONNÉES D'INITIALISATION
# ==========================================

seed_data:
  exercices:
    description: "Liste d'exercices prédéfinis générée par agent Firebase Specialist"
    quantite: "~50 exercices populaires"
    categorisation:
      - "Par Groupe Musculaire (pectoraux, dos, jambes, etc.)"
      - "Par Type (poids libres, machines, poids corporel, cardio)"
    format: "Collection Firestore 'exercises' avec structure standardisée"
    icones: "Emojis adaptés par catégorie (ex: 💪 pour bras, 🦵 pour jambes)"

# ==========================================
# VALIDATION RG-PRJ
# ==========================================

validation:
  rg_prj_001: "✅ Nom projet unique: apollon"
  rg_prj_002: "✅ Glossaire >= 5 concepts (6 concepts définis)"
  completeness: "✅ Toutes les sections complétées"
  consistency: "✅ Cohérence validée entre glossaire, processus et règles"

