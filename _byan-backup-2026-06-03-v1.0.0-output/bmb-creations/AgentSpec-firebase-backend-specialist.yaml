capabilities:
  - id: "CAP-1"
    name: "Concevoir architecture Firestore"
    description: "Modéliser collections et documents selon le glossaire métier Apollon"
    category: "create"
    firestore_architecture: |
      # Architecture Firestore Apollon
      
      ## Collections Top-Level
      
      /users/{userId}
        - email: string
        - displayName: string
        - createdAt: timestamp
        - preferences: map (theme, language, units - V2)
      
      /users/{userId}/workouts/{workoutId}
        - date: timestamp
        - duration: number (minutes, nullable - V2 avec chrono)
        - status: string (enum: 'draft', 'completed')
        - createdAt: timestamp
        - updatedAt: timestamp
        - exercises: array<map> (dénormalisé pour performance)
          [
            {
              exerciseId: string (ref to /exercises/{id}),
              exerciseName: string (dénormalisé),
              sets: array<map>
                [
                  { reps: number, weight: number },
                  ...
                ]
            },
            ...
          ]
      
      /exercises/{exerciseId}
        - name: string (unique)
        - muscleGroups: array<string> (enum: 'pectoraux', 'biceps', 'quadriceps', ...)
        - type: string (enum: 'free_weights', 'machine', 'bodyweight', 'cardio')
        - emoji: string ('💪', '🦵', '🏃')
        - description: string (optional)
        - imageUrl: string (nullable - V2 avec images IA)
        - createdAt: timestamp
      
      ## Indexes Requis (Composite)
      
      1. /users/{userId}/workouts
         - Collection: workouts
         - Fields: status ASC, date DESC
         - Query: Récupérer séances complétées triées par date
      
      2. /exercises
         - Collection: exercises
         - Fields: muscleGroups ARRAY_CONTAINS, name ASC
         - Query: Filtrer exercices par groupe musculaire + tri alphabétique
      
      3. /exercises
         - Collection: exercises
         - Fields: type ASC, name ASC
         - Query: Filtrer exercices par type + tri alphabétique
    
    rationale_denormalization: |
      CHOIX ARCHITECTURE: Dénormalisation partielle
      
      ✅ POUR (exercices dénormalisés dans workouts):
      - Performance: 1 seule lecture pour récupérer séance complète
      - Offline: Séance complète disponible hors ligne
      - Coût: Réduction drastique du nombre de lectures
      
      ❌ CONTRE:
      - Duplication: exerciseName dupliqué (mais acceptable, change rarement)
      - Mise à jour: Si exerciseName change, pas de propagation auto
      
      DÉCISION: DÉNORMALISER
      - Exercices changent rarement (seed data stable)
      - Performance lecture >>> maintenance mise à jour
      - Quota gratuit préservé (1 read vs 5+ reads par séance)
    
    quality_criteria:
      - "Alignement parfait avec glossaire métier (6 concepts)"
      - "Performance optimisée (dénormalisation stratégique)"
      - "Coûts minimisés (quota gratuit respecté)"
      - "Documentation schéma claire (diagrammes)"

  - id: "CAP-2"
    name: "Implémenter Firebase Auth"
    description: "Configurer Google Sign-In et gérer états d'authentification"
    category: "create"
    implementation: |
      # Configuration Firebase Auth - Google Sign-In
      
      ## 1. Firebase Console Setup
      - Activer Google Sign-In dans Authentication > Sign-in method
      - Android: Configurer SHA-1/SHA-256 fingerprints
      - iOS: Configurer URL scheme + GoogleService-Info.plist
      
      ## 2. Flutter Dependencies (pubspec.yaml)
      dependencies:
        firebase_core: ^2.24.0
        firebase_auth: ^4.16.0
        google_sign_in: ^6.1.0
      
      ## 3. Service d'authentification (auth_service.dart)
      
      ```dart
      import 'package:firebase_auth/firebase_auth.dart';
      import 'package:google_sign_in/google_sign_in.dart';
      
      class AuthService {
        final FirebaseAuth _auth = FirebaseAuth.instance;
        final GoogleSignIn _googleSignIn = GoogleSignIn();
        
        // Stream pour observer état auth
        Stream<User?> get authStateChanges => _auth.authStateChanges();
        
        // Utilisateur actuel
        User? get currentUser => _auth.currentUser;
        
        // Connexion Google
        Future<UserCredential?> signInWithGoogle() async {
          try {
            // Déclenche flow Google Sign-In
            final GoogleSignInAccount? googleUser = await _googleSignIn.signIn();
            if (googleUser == null) return null; // Utilisateur a annulé
            
            // Obtenir credentials
            final GoogleSignInAuthentication googleAuth = 
                await googleUser.authentication;
            
            final credential = GoogleAuthProvider.credential(
              accessToken: googleAuth.accessToken,
              idToken: googleAuth.idToken,
            );
            
            // Sign in Firebase
            return await _auth.signInWithCredential(credential);
          } catch (e) {
            print('Erreur Google Sign-In: $e');
            rethrow; // Géré par UI
          }
        }
        
        // Déconnexion
        Future<void> signOut() async {
          await Future.wait([
            _auth.signOut(),
            _googleSignIn.signOut(),
          ]);
        }
        
        // Créer/Mettre à jour profil utilisateur Firestore
        Future<void> createUserProfile(User user) async {
          final userDoc = FirebaseFirestore.instance
              .collection('users')
              .doc(user.uid);
          
          final exists = await userDoc.get();
          if (!exists.exists) {
            await userDoc.set({
              'email': user.email,
              'displayName': user.displayName,
              'createdAt': FieldValue.serverTimestamp(),
            });
          }
        }
      }
      ```
      
      ## 4. Provider d'authentification (auth_provider.dart)
      
      ```dart
      class AuthProvider extends ChangeNotifier {
        final AuthService _authService = AuthService();
        User? _user;
        bool _isLoading = false;
        String? _error;
        
        User? get user => _user;
        bool get isLoading => _isLoading;
        String? get error => _error;
        bool get isAuthenticated => _user != null;
        
        AuthProvider() {
          // Écouter changements auth
          _authService.authStateChanges.listen((user) {
            _user = user;
            notifyListeners();
          });
        }
        
        Future<void> signIn() async {
          _isLoading = true;
          _error = null;
          notifyListeners();
          
          try {
            final credential = await _authService.signInWithGoogle();
            if (credential != null) {
              await _authService.createUserProfile(credential.user!);
            }
          } catch (e) {
            _error = 'Erreur de connexion: ${e.toString()}';
          } finally {
            _isLoading = false;
            notifyListeners();
          }
        }
        
        Future<void> signOut() async {
          await _authService.signOut();
        }
      }
      ```
      
      ## 5. Guard de navigation (auth_guard.dart)
      
      ```dart
      class AuthGuard extends StatelessWidget {
        final Widget child;
        
        @override
        Widget build(BuildContext context) {
          return Consumer<AuthProvider>(
            builder: (context, auth, _) {
              if (auth.isLoading) return LoadingScreen();
              if (!auth.isAuthenticated) return LoginScreen();
              return child; // App principale
            },
          );
        }
      }
      ```
    
    security_notes: |
      SÉCURITÉ AUTH:
      - ✅ Token Google Sign-In géré automatiquement (refresh auto)
      - ✅ Pas de stockage credential côté client (Firebase gère)
      - ✅ HTTPS obligatoire pour production
      - ⚠️ Configurer SHA fingerprints production (pas debug key!)
    
    quality_criteria:
      - "Implémentation complète et fonctionnelle"
      - "Gestion erreurs explicite"
      - "State management intégré (Provider)"
      - "Security best practices respectées"

  - id: "CAP-3"
    name: "Rédiger règles de sécurité Firestore"
    description: "Implémenter Security Rules pour protection des données"
    category: "create"
    security_rules: |
      # Firestore Security Rules - Apollon
      # firestore.rules
      
      rules_version = '2';
      service cloud.firestore {
        match /databases/{database}/documents {
          
          // Helper functions
          function isAuthenticated() {
            return request.auth != null;
          }
          
          function isOwner(userId) {
            return isAuthenticated() && request.auth.uid == userId;
          }
          
          function validateWorkout(workout) {
            return workout.keys().hasAll(['date', 'status', 'exercises'])
                && workout.status in ['draft', 'completed']
                && workout.exercises is list;
          }
          
          function validateSet(set) {
            return set.keys().hasAll(['reps', 'weight'])
                && set.reps is int && set.reps > 0
                && set.weight is number && set.weight >= 0;
          }
          
          // Users collection
          match /users/{userId} {
            // Règle RG-001: Auth obligatoire
            allow read, write: if isOwner(userId);
            
            // Workouts subcollection
            match /workouts/{workoutId} {
              // Isolation utilisateur (RG-001)
              allow read: if isOwner(userId);
              
              // Création (draft ou completed)
              allow create: if isOwner(userId)
                            && validateWorkout(request.resource.data);
              
              // Mise à jour (validation séries RG-003)
              allow update: if isOwner(userId)
                            && validateWorkout(request.resource.data)
                            && request.resource.data.exercises.size() > 0;
              
              // Suppression (EC-004)
              allow delete: if isOwner(userId);
            }
          }
          
          // Exercises collection (lecture publique pour tous utilisateurs auth)
          match /exercises/{exerciseId} {
            // Lecture: Tous les utilisateurs authentifiés
            allow read: if isAuthenticated();
            
            // Écriture: Admin seulement (pour seed data)
            // V1: Pas d'ajout exercice par utilisateur
            allow write: if false; // Désactivé V1
          }
        }
      }
    
    rules_explanation: |
      RÈGLES APPLIQUÉES:
      
      RG-001 (Auth obligatoire):
      - ✅ isAuthenticated() vérifié partout
      - ✅ Aucun accès sans auth
      
      RG-001 (Isolation utilisateur):
      - ✅ isOwner(userId) garantit accès seulement à ses données
      - ✅ userId dans path (pas de query cross-user possible)
      
      RG-002 (Unicité exercices):
      - ✅ Pas de write pour users (seed data admin seulement)
      - ✅ Index unique sur 'name' (Firebase Console)
      
      RG-003 (Validation séries):
      - ✅ validateSet() vérifie reps > 0, weight >= 0
      - ✅ Validation côté serveur (pas seulement client)
      
      EC-004 (Suppression):
      - ✅ delete autorisé si owner
    
    testing: |
      # Tests Security Rules (Firebase Emulator)
      
      ## Test isolation utilisateur
      - User A crée workout → ✅ Success
      - User B tente read workout de A → ❌ Denied
      - User A read son workout → ✅ Success
      
      ## Test validation séries
      - Create workout avec reps = 0 → ❌ Denied (RG-003)
      - Create workout avec reps = 10, weight = 80 → ✅ Success
      - Create workout avec weight = -5 → ❌ Denied
      
      ## Test exercices
      - User read exercises → ✅ Success (lecture publique auth)
      - User create exercise → ❌ Denied (admin only)
    
    quality_criteria:
      - "Isolation complète entre utilisateurs"
      - "Validation schéma côté serveur"
      - "Tests emulator passés à 100%"
      - "Documentation complète des règles"

  - id: "CAP-4"
    name: "Optimiser requêtes et coûts"
    description: "Minimiser lectures Firestore pour rester dans quota gratuit"
    category: "optimize"
    
    quota_gratuit_firebase: |
      QUOTA GRATUIT FIRESTORE (Spark Plan):
      - Reads: 50,000/jour
      - Writes: 20,000/jour
      - Deletes: 20,000/jour
      - Storage: 1 GB
      
      ESTIMATION APOLLON (1 utilisateur actif):
      - Connexion: 1 read (user profile)
      - Chargement exercices: 50 reads (seed data) → 1× au premier lancement, puis cache
      - Créer séance: 1 write (draft), N writes (finalisation)
      - Consulter historique: M reads (M = nombre séances)
      - Total/jour estimé: < 100 reads, < 10 writes
      
      CONCLUSION: Largement dans quota gratuit ✅
    
    optimization_strategies: |
      # Stratégies d'optimisation
      
      ## 1. Cache local Firestore (offline persistence)
      ```dart
      await FirebaseFirestore.instance
          .settings = Settings(persistenceEnabled: true);
      ```
      → Données en cache = 0 read serveur
      
      ## 2. Pagination (limite + startAfter)
      ```dart
      // ❌ MAUVAIS: Charger tout l'historique
      await workoutsRef.get();
      
      // ✅ BON: Pagination (10 séances par page)
      Query query = workoutsRef
          .orderBy('date', descending: true)
          .limit(10);
      
      // Page suivante
      Query nextPage = query.startAfterDocument(lastDocument);
      ```
      
      ## 3. Dénormalisation (trade-off reads vs writes)
      ✅ exerciseName dans workout (évite jointure)
      → 1 read workout complet vs 5+ reads (workout + exercises)
      
      ## 4. Listeners ciblés (pas de snapshots globaux)
      ```dart
      // ❌ MAUVAIS: Listener sur toute collection
      workoutsRef.snapshots().listen(...); // Read à chaque changement
      
      // ✅ BON: Listener sur document spécifique (séance en cours)
      workoutsRef.doc(currentWorkoutId).snapshots().listen(...);
      ```
      
      ## 5. Batch writes (grouper écritures)
      ```dart
      WriteBatch batch = FirebaseFirestore.instance.batch();
      batch.set(workoutRef, workoutData);
      batch.update(userRef, {'lastWorkoutDate': DateTime.now()});
      await batch.commit(); // 1 write batch vs 2 writes séparées
      ```
    
    use_case_specific: |
      # Optimisation Use Case P2 (Enregistrer séance)
      
      ## Problème initial
      - Afficher "dernière séance pour exercice X"
      - Requête naïve: workouts.where('exercises', arrayContains: exerciseId)
      - Coût: N reads (N = nombre total de séances)
      
      ## Solution optimisée
      
      ### Option A: Dénormalisation (recommandée)
      Ajouter collection:
      /users/{userId}/lastExerciseSets/{exerciseId}
        - lastWorkoutDate: timestamp
        - sets: array<map> (dernières séries)
      
      → 1 read par exercice sélectionné (coût fixe)
      
      ### Option B: Query limitée + cache
      ```dart
      workoutsRef
        .where('status', isEqualTo: 'completed')
        .orderBy('date', descending: true)
        .limit(5)  // Seulement 5 dernières séances
        .get();
      
      // Filtrer côté client pour trouver exercice X
      ```
      → Max 5 reads, en cache après première récupération
      
      DÉCISION V1: Option B (plus simple, coût acceptable)
      V2: Option A si performance critique
    
    monitoring: |
      # Monitoring quotas Firebase
      
      ## Firebase Console
      - Usage > Firestore > Activité
      - Alertes si > 80% quota
      
      ## Code (optionnel V2)
      ```dart
      class FirebaseUsageMonitor {
        static int _readsToday = 0;
        
        static void trackRead() {
          _readsToday++;
          if (_readsToday > 40000) { // 80% du quota
            print('⚠️ WARNING: Approche limite quota reads');
          }
        }
      }
      ```
    
    quality_criteria:
      - "Reads/jour < 50% quota (marge sécurité)"
      - "Cache Firestore activé"
      - "Pagination implémentée pour listes longues"
      - "Documentation coûts par feature"

  - id: "CAP-5"
    name: "Déboguer et monitorer"
    description: "Analyser logs Firebase et détecter problèmes sécurité/performance"
    category: "analyze"
    
    debugging_tools: |
      # Outils de débogage Firebase
      
      ## 1. Firebase Emulator Suite (local development)
      ```bash
      firebase emulators:start --only firestore,auth
      ```
      - Test règles sécurité localement
      - Pas de coût, données locales
      - UI admin: http://localhost:4000
      
      ## 2. Firebase Console Logs
      - Firestore > Data > [Visualiser documents]
      - Authentication > Users > [Logs connexions]
      - Usage > Firestore > [Métriques reads/writes]
      
      ## 3. Flutter DevTools
      - Network profiler (observer requêtes Firestore)
      - Timeline (détecter jank si requêtes lentes)
      
      ## 4. Crashlytics (production)
      ```dart
      try {
        await FirebaseService.saveWorkout(workout);
      } catch (e, stack) {
        FirebaseCrashlytics.instance.recordError(e, stack);
        rethrow;
      }
      ```
    
    common_issues: |
      # Problèmes fréquents et diagnostics
      
      ## Issue: "Permission denied"
      Symptôme: User ne peut pas lire/écrire
      Diagnostic:
      - ✅ Vérifier isAuthenticated() dans rules
      - ✅ Vérifier userId dans path
      - ✅ Tester rules dans Emulator
      
      ## Issue: "Missing or insufficient permissions"
      Symptôme: Requête refusée
      Diagnostic:
      - ✅ Vérifier Security Rules correspondent à la query
      - ✅ Index composite créé ? (Firebase Console alerte)
      - ✅ Champs dans where() existent dans rules allow ?
      
      ## Issue: Requêtes lentes (> 2s)
      Symptôme: UI freeze
      Diagnostic:
      - ✅ Index manquant ? (Firebase Console propose auto)
      - ✅ Trop de documents retournés ? (ajouter limit())
      - ✅ Cache désactivé ? (vérifier persistenceEnabled)
      
      ## Issue: Quota dépassé
      Symptôme: Erreur "quota exceeded"
      Diagnostic:
      - ✅ Listeners trop larges ? (snapshots sur collection entière)
      - ✅ Pas de pagination ? (get() sans limit)
      - ✅ Pas de cache ? (chaque get() = read serveur)
    
    monitoring_checklist: |
      # Checklist monitoring production
      
      ✅ Quotas Firebase
      - Reads/jour < 50% quota
      - Writes/jour < 50% quota
      - Storage < 500 MB
      
      ✅ Performance
      - Temps réponse requêtes < 1s (p95)
      - Pas de timeout Firestore
      - Cache hit rate > 70%
      
      ✅ Sécurité
      - Aucune erreur "permission denied" légitime
      - Audit logs auth (connexions suspectes)
      - Security Rules testées à 100%
      
      ✅ Erreurs
      - Crashlytics: 0 crash lié à Firebase
      - Logs: Pas d'erreurs récurrentes
    
    quality_criteria:
      - "Outils debugging configurés (Emulator, Console)"
      - "Problèmes fréquents documentés avec solutions"
      - "Monitoring production en place"

