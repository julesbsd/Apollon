  - id: "UC-3"
    scenario: "Optimiser requête 'dernières séances exercice'"
    user_story: "Je veux que l'agent m'aide à optimiser la requête 'récupérer les 3 dernières séances d'un exercice' pour minimiser les lectures Firestore et rester dans le quota gratuit"
    input: |
      Problème actuel:
      ```dart
      // Requête naïve (coûteuse)
      await workoutsRef
        .where('exercises', arrayContainsAny: [exerciseId])
        .get();
      // → Lit TOUTES les séances, filtre côté client
      // → 100+ reads si 100 séances historiques
      ```
    expected_behavior: |
      Agent analyse et propose optimisations:
      
      # Optimisation Requête "Dernières Séances Exercice"
      
      ## Problème Identifié
      - Requête actuelle: arrayContainsAny sur toute collection
      - Coût: N reads (N = total séances user)
      - Quota: Insoutenable si historique > 500 séances
      
      ## Solutions Comparées
      
      ### Option A: Query limitée + cache ⭐ RECOMMANDÉ V1
      ```dart
      Query query = workoutsRef
        .where('status', isEqualTo: 'completed')
        .orderBy('date', descending: true)
        .limit(10); // Seulement 10 dernières séances
      
      QuerySnapshot snapshot = await query.get(
        GetOptions(source: Source.cache) // Cache prioritaire
      );
      
      // Filtrer côté client pour exercice X
      List<Workout> filtered = snapshot.docs
        .where((doc) => doc['exercises'].any((ex) => ex['exerciseId'] == exerciseId))
        .take(3)
        .toList();
      ```
      
      Avantages:
      - ✅ Coût fixe: max 10 reads (première fois), 0 reads ensuite (cache)
      - ✅ Simple à implémenter
      - ✅ Pas de changement architecture
      
      Inconvénients:
      - ⚠️ Suppose que exercice X dans 10 dernières séances (acceptable V1)
      
      ### Option B: Dénormalisation (V2 si perf critique)
      Créer collection:
      ```
      /users/{userId}/lastExerciseSets/{exerciseId}
        - lastSets: array (3 dernières séries)
        - lastWorkoutDate: timestamp
      ```
      → 1 read garanti
      → Complexité: Mise à jour automatique à chaque séance (Cloud Function ou client)
      
      ## Recommandation Finale
      **Option A pour V1**, Option B pour V2 si besoin
      
      ## Implémentation Complète (Option A)
      [Code complet fourni avec cache, error handling, tests]
      
      ## Estimation Coûts
      - Première récupération: 10 reads
      - Récupérations suivantes (cache): 0 reads
      - Total/jour (user consulte 20 exercices): 10 reads (cache hit 95%)
      - Conclusion: Très largement sous quota ✅
    validation:
      - "Analyse comparative solutions (trade-offs clairs)"
      - "Recommandation justifiée (contexte V1)"
      - "Code implémentation complet"
      - "Estimation coûts chiffrée"

# ==========================================
# ANTI-PATTERNS TO AVOID
# ==========================================

anti_patterns:
  - "Sur-normalisation (joins multiples = coûts explosifs)"
  - "Listeners globaux (snapshots sur collection entière)"
  - "Pas de pagination (get() sans limit)"
  - "Ignorer cache Firestore (chaque get() = read serveur)"
  - "Security Rules permissives (allow read, write: if true)"
  - "Pas de validation schéma (données corrompues)"
  - "Indexes manquants (queries lentes ou échouées)"
  - "Magic strings pour collections/fields (pas de constantes)"

