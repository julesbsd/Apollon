    scenario: "Implémenter règles de sécurité"
    user_story: "Je veux que l'agent implémente les règles de sécurité Firestore pour garantir qu'un utilisateur ne peut accéder qu'à ses propres séances"
    input: |
      Commande: "Implémente les Security Rules Firestore selon RG-001 (isolation) et RG-003 (validation)"
      Architecture: Schéma Firestore défini (users/workouts/exercises)
    expected_behavior: |
      Agent génère firestore.rules complet:
      
      ```
      rules_version = '2';
      service cloud.firestore {
        match /databases/{database}/documents {
          
          // Helpers
          function isAuthenticated() { return request.auth != null; }
          function isOwner(userId) { return request.auth.uid == userId; }
          function validateWorkout(...) { /* RG-003 */ }
          
          // RG-001: Isolation users
          match /users/{userId} {
            allow read, write: if isOwner(userId);
            
            match /workouts/{workoutId} {
              allow read: if isOwner(userId);
              allow create: if isOwner(userId) && validateWorkout(...);
              allow update: if isOwner(userId) && validateWorkout(...);
              allow delete: if isOwner(userId); // EC-004
            }
          }
          
          // Exercises: lecture publique auth, write admin only
          match /exercises/{exerciseId} {
            allow read: if isAuthenticated();
            allow write: if false; // V1: seed data admin
          }
        }
      }
      ```
      
      Agent fournit:
