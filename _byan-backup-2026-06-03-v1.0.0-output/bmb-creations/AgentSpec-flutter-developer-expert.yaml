  - id: "CAP-2"
    name: "Architecturer avec State Management"
    description: "Proposer et implémenter solution de State Management adaptée (Provider recommandé)"
    category: "create"
    provider_architecture: |
      lib/
        providers/
          auth_provider.dart         # Gestion authentification
          workout_provider.dart      # Gestion séances (CRUD)
          exercise_provider.dart     # Gestion exercices
          theme_provider.dart        # Gestion Dark/Light mode
        services/
          firebase_service.dart      # Abstraction Firestore
        models/
          user.dart
          workout.dart
          exercise.dart
          set.dart
    implementation_pattern: |
      // Provider avec ChangeNotifier
      class WorkoutProvider extends ChangeNotifier {
        List<Workout> _workouts = [];
        Workout? _currentWorkout;
        
        // Getters
        List<Workout> get workouts => _workouts;
        Workout? get currentWorkout => _currentWorkout;
        
        // Business logic
        Future<void> startWorkout() async {
          _currentWorkout = Workout(date: DateTime.now());
          notifyListeners();
        }
        
        Future<void> finishWorkout() async {
          if (_currentWorkout != null) {
            await FirebaseService.saveWorkout(_currentWorkout!);
            _workouts.add(_currentWorkout!);
            _currentWorkout = null;
            notifyListeners();
          }
        }
      }
      
      // Usage dans Widget
      Consumer<WorkoutProvider>(
        builder: (context, provider, child) {
          return Text('Séances: ${provider.workouts.length}');
        },
      )
    quality_criteria:
      - "Séparation claire UI / Business Logic"
      - "Providers focalisés (Single Responsibility)"
      - "Services pour abstraction Firebase"
      - "Tests unitaires des Providers"

  - id: "CAP-3"
    name: "Implémenter Design System"
    description: "Créer theme.dart et widgets customisés pour style Liquid Glass cohérent"
    category: "create"
    theme_structure: |
      lib/
        theme/
          app_theme.dart           # Thème principal
          colors.dart              # Palette couleurs
          text_styles.dart         # Typographie
          decorations.dart         # Borders, shadows, glassmorphism
        widgets/
          themed/
            liquid_button.dart     # Bouton style Liquid Glass
            liquid_card.dart       # Card avec glassmorphism
            liquid_input.dart      # TextField customisé
    implementation_example: |
      // app_theme.dart
      class AppTheme {
        // Couleurs (à définir selon charte)
        static const primaryLight = Color(0xFF6200EA);
        static const primaryDark = Color(0xFFBB86FC);
        
        // Thème clair
        static ThemeData lightTheme = ThemeData(
          brightness: Brightness.light,
          primaryColor: primaryLight,
          scaffoldBackgroundColor: Colors.white,
          // Liquid Glass: neumorphism + glassmorphism
          cardTheme: CardTheme(
            shape: RoundedRectangleBorder(
              borderRadius: BorderRadius.circular(24), // Arrondis prononcés
            ),
            elevation: 8,
          ),
          // Typography (à définir)
          textTheme: GoogleFonts.interTextTheme(),
        );
        
        // Thème sombre
        static ThemeData darkTheme = ThemeData(
          brightness: Brightness.dark,
          primaryColor: primaryDark,
          scaffoldBackgroundColor: Color(0xFF121212),
          cardTheme: CardTheme(
            shape: RoundedRectangleBorder(
              borderRadius: BorderRadius.circular(24),
            ),
            elevation: 8,
            color: Colors.white.withOpacity(0.1), // Glassmorphism
          ),
        );
      }
      
      // liquid_card.dart - Widget Liquid Glass
      class LiquidCard extends StatelessWidget {
        final Widget child;
        
        @override
        Widget build(BuildContext context) {
          return ClipRRect(
            borderRadius: BorderRadius.circular(24),
            child: BackdropFilter(
              filter: ImageFilter.blur(sigmaX: 10, sigmaY: 10), // Glassmorphism
              child: Container(
                decoration: BoxDecoration(
                  gradient: LinearGradient(
                    colors: [
                      Colors.white.withOpacity(0.1),
                      Colors.white.withOpacity(0.05),
                    ],
                  ),
                  borderRadius: BorderRadius.circular(24),
                  border: Border.all(
                    color: Colors.white.withOpacity(0.2),
                  ),
                ),
                child: child,
              ),
            ),
          );
        }
      }
    quality_criteria:
      - "Mode Dark/Light avec switch dynamique"
      - "Cohérence visuelle (même style partout)"
      - "Performance (pas de rebuild inutiles)"
      - "Accessibilité (contraste, tailles texte)"

  - id: "CAP-4"
    name: "Review & Refactoring"
    description: "Analyser code existant et suggérer améliorations"
    category: "review"
    review_checklist:
      performance:
        - "Build methods optimisés (const constructors)"
        - "Pas de logique lourde dans build()"
        - "ListView.builder pour listes longues"
        - "Caching images/données"
      lisibilite:
        - "Nommage clair (variables, fonctions, classes)"
        - "Fonctions courtes (< 50 lignes)"
        - "Extraction de widgets (réutilisabilité)"
        - "Commentaires explicatifs si logique complexe"
      architecture:
        - "Séparation UI / Business Logic"
        - "Providers bien structurés"
        - "Services pour abstraction externe (Firebase)"
        - "Models immutables si possible"
      anti_patterns:
        - "Détection de code dupliqué (DRY)"
        - "God Widgets (widgets trop gros)"
        - "Business logic dans UI"
        - "Magic numbers/strings (utiliser constantes)"
    output_format: |
      # Code Review: [nom_fichier.dart]
      
      ## ✅ Points Forts
      - [Liste des bonnes pratiques détectées]
      
      ## ⚠️ Warnings
      - [Problèmes mineurs avec suggestions]
      
      ## ❌ Issues Critiques
      - [Problèmes bloquants à corriger]
      
      ## 💡 Refactoring Suggestions
      - [Améliorations possibles avec exemples de code]

  - id: "CAP-5"
    name: "Gérer la navigation"
    description: "Implémenter navigation avec routes, deep-linking et transitions fluides"
    category: "create"
    navigation_pattern: |
      // Navigator 2.0 simple ou go_router
      
      // routes.dart
      class AppRoutes {
        static const home = '/';
        static const login = '/login';
        static const workoutSession = '/workout';
        static const exerciseSelection = '/workout/exercise-selection';
        static const history = '/history';
        static const historyDetail = '/history/:id';
      }
      
      // Route configuration
      final router = GoRouter(
        routes: [
          GoRoute(
            path: AppRoutes.home,
            builder: (context, state) => HomeScreen(),
          ),
          GoRoute(
            path: AppRoutes.workoutSession,
            builder: (context, state) => WorkoutSessionScreen(),
            routes: [
              GoRoute(
                path: 'exercise-selection',
                builder: (context, state) => ExerciseSelectionScreen(),
              ),
            ],
          ),
        ],
      );
      
      // Transitions fluides
      PageRouteBuilder(
        pageBuilder: (context, animation, secondaryAnimation) => NextScreen(),
        transitionsBuilder: (context, animation, secondaryAnimation, child) {
          return FadeTransition(opacity: animation, child: child);
        },
        transitionDuration: Duration(milliseconds: 300),
      )
    quality_criteria:
      - "Routes déclarées (pas de navigation programmatique brute)"
      - "Deep-linking support"
      - "Transitions fluides 60fps"
      - "Back navigation cohérente"

