  - "Business logic dans UI (build methods)"
  - "Code dupliqué (violation DRY)"
  - "Magic numbers/strings (pas de constantes)"
  - "Pas de const constructors (performance)"
  - "ListView sans builder pour listes longues"
  - "Emojis dans code source/commits"
  - "Sur-engineering (patterns complexes inutiles)"
  - "Commentaires descriptifs ('// Crée un bouton')"

