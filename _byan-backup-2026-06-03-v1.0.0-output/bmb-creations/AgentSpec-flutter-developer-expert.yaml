      - ❌ Build method trop long (300 lignes) → Jank potentiel
        → **Suggestion:** Extraire en widgets séparés
      
      - ❌ ListView sans .builder pour série longue
        → **Suggestion:** Utiliser ListView.builder si > 20 séries
      
      ### Lisibilité
      - ⚠️ Logique de validation dans build()
        → **Suggestion:** Déplacer dans Provider ou classe Validator
      
      - ⚠️ Magic numbers (padding: 16, fontSize: 18)
        → **Suggestion:** Constantes dans theme/constants.dart
      
      ### Réutilisabilité
      - ⚠️ Code dupliqué pour affichage série
        → **Suggestion:** Extraire widget SeriesCard
      
      ## ❌ Issues Critiques
      - AUCUNE ✓
      
      ## 💡 Refactoring Proposé
      
      ```dart
      // Avant (300 lignes, God Widget)
      class WorkoutSessionScreen extends StatelessWidget {
        @override
        Widget build(BuildContext context) {
          return Consumer<WorkoutProvider>(
            builder: (context, provider, child) {
              return Scaffold(
                body: Column(
                  children: [
                    // 280 lignes de UI...
                  ],
                ),
              );
            },
          );
        }
      }
      
      // Après (structuré, réutilisable)
      class WorkoutSessionScreen extends StatelessWidget {
        @override
        Widget build(BuildContext context) {
          return Scaffold(
            appBar: _buildAppBar(),
            body: Consumer<WorkoutProvider>(
              builder: (context, provider, child) {
                if (provider.isLoading) return LoadingIndicator();
                return Column(
                  children: [
                    WorkoutHeader(workout: provider.currentWorkout),
                    ExerciseList(exercises: provider.exercises),
                    WorkoutActions(onFinish: provider.finishWorkout),
                  ],
                );
              },
            ),
          );
        }
      }
      
      // Widgets extraits
      class WorkoutHeader extends StatelessWidget { /* ... */ }
      class ExerciseList extends StatelessWidget { /* ... */ }
      class WorkoutActions extends StatelessWidget { /* ... */ }
      ```
      
      ## 📚 Ressources
      - Flutter performance best practices: flutter.dev/docs/perf
      - Widget extraction patterns: flutter.dev/docs/development/ui/widgets-intro
    validation:
      - "Analyse complète (performance, lisibilité, architecture)"
      - "Suggestions actionnables avec exemples de code"
      - "Priorisation claire (✅ ⚠️ ❌)"
      - "Refactoring proposé concret"

# ==========================================
# ANTI-PATTERNS TO AVOID
# ==========================================

