<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="500px" height="500px" viewBox="0 0 500 500">
<!-- Pictogramme custom : Shrug machine (haussements d'epaules) — debout, bras le long du corps tenant deux poignees, epaules haussees -->
<defs>
<linearGradient id="steelV" gradientUnits="userSpaceOnUse" x1="55" y1="0" x2="150" y2="0">
	<stop offset="0.06" style="stop-color:#0D0D0D"/>
	<stop offset="0.09" style="stop-color:#999999"/>
	<stop offset="0.11" style="stop-color:#C8C8C8"/>
	<stop offset="0.15" style="stop-color:#9D9D9D"/>
	<stop offset="0.19" style="stop-color:#777777"/>
	<stop offset="0.24" style="stop-color:#575757"/>
	<stop offset="0.3" style="stop-color:#3B3B3B"/>
	<stop offset="0.36" style="stop-color:#252525"/>
	<stop offset="0.43" style="stop-color:#141414"/>
	<stop offset="0.52" style="stop-color:#090909"/>
	<stop offset="0.65" style="stop-color:#020202"/>
	<stop offset="1" style="stop-color:#000000"/>
</linearGradient>
<linearGradient id="steelH" gradientUnits="userSpaceOnUse" x1="0" y1="116" x2="0" y2="132">
	<stop offset="0.06" style="stop-color:#0D0D0D"/>
	<stop offset="0.12" style="stop-color:#8A8A8A"/>
	<stop offset="0.2" style="stop-color:#C8C8C8"/>
	<stop offset="0.35" style="stop-color:#6E6E6E"/>
	<stop offset="0.6" style="stop-color:#2B2B2B"/>
	<stop offset="1" style="stop-color:#000000"/>
</linearGradient>
</defs>
<!-- Sol -->
<rect x="30" y="432" width="440" height="8" rx="4" fill="#1A1A1A"/>
<!-- Colonne de charge : montants -->
<rect x="62" y="120" width="10" height="312" rx="4" fill="url(#steelV)"/>
<rect x="132" y="120" width="10" height="312" rx="4" fill="url(#steelV)"/>
<rect x="52" y="108" width="100" height="14" rx="6" fill="#111111"/>
<!-- Pile de plaques -->
<g fill="url(#steelV)">
	<rect x="56" y="252" width="92" height="15" rx="4"/>
	<rect x="56" y="270" width="92" height="15" rx="4"/>
	<rect x="56" y="288" width="92" height="15" rx="4"/>
	<rect x="56" y="306" width="92" height="15" rx="4"/>
	<rect x="56" y="324" width="92" height="15" rx="4"/>
	<rect x="56" y="342" width="92" height="15" rx="4"/>
	<rect x="56" y="360" width="92" height="15" rx="4"/>
	<rect x="56" y="378" width="92" height="15" rx="4"/>
	<rect x="56" y="396" width="92" height="15" rx="4"/>
	<rect x="56" y="414" width="92" height="15" rx="4"/>
</g>
<!-- Poutre superieure et poulies de renvoi -->
<rect x="150" y="116" width="216" height="14" rx="7" fill="url(#steelH)"/>
<circle cx="176" cy="123" r="8" fill="#0D0D0D"/>
<circle cx="340" cy="123" r="8" fill="#0D0D0D"/>
<!-- Cables des poignees vers les poulies hautes -->
<path d="M234,326 L176,130" stroke="#333333" stroke-width="4" fill="none" stroke-linecap="round"/>
<path d="M266,326 L340,130" stroke="#333333" stroke-width="4" fill="none" stroke-linecap="round"/>
<!-- Personnage : jambe gauche -->
<path d="M250,318 L244,370 L242,420" stroke="#EEEEEE" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<!-- Personnage : jambe droite -->
<path d="M250,318 L256,370 L258,420" stroke="#EEEEEE" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<!-- Pieds -->
<path d="M242,420 L226,414" stroke="#CCCCCC" stroke-width="13" fill="none" stroke-linecap="round"/>
<path d="M258,420 L274,414" stroke="#CCCCCC" stroke-width="13" fill="none" stroke-linecap="round"/>
<!-- Torse vertical, epaules haussees -->
<path d="M250,320 L250,244" stroke="#EEEEEE" stroke-width="34" fill="none" stroke-linecap="round"/>
<!-- Bras gauche tendu le long du corps -->
<path d="M250,250 L236,330" stroke="#EEEEEE" stroke-width="18" fill="none" stroke-linecap="round"/>
<!-- Bras droit tendu le long du corps -->
<path d="M250,250 L264,330" stroke="#EEEEEE" stroke-width="18" fill="none" stroke-linecap="round"/>
<!-- Poignees -->
<rect x="229" y="326" width="9" height="24" rx="4.5" fill="#0D0D0D"/>
<rect x="262" y="326" width="9" height="24" rx="4.5" fill="#0D0D0D"/>
<!-- Tete -->
<circle cx="250" cy="210" r="23" fill="#CCCCCC"/>
<!-- Mains sur les poignees -->
<circle cx="234" cy="332" r="10" fill="#CCCCCC"/>
<circle cx="266" cy="332" r="10" fill="#CCCCCC"/>
</svg>
