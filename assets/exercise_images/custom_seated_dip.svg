<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="500px" height="500px" viewBox="0 0 500 500">
<!-- Pictogramme custom : Dips assis machine (seated dip) — style silhouette du catalogue Apollon -->
<defs>
<linearGradient id="steelV" gradientUnits="userSpaceOnUse" x1="352" y1="0" x2="452" y2="0">
	<stop offset="0.06" style="stop-color:#0D0D0D"/>
	<stop offset="0.09" style="stop-color:#999999"/>
	<stop offset="0.11" style="stop-color:#C8C8C8"/>
	<stop offset="0.15" style="stop-color:#9D9D9D"/>
	<stop offset="0.19" style="stop-color:#777777"/>
	<stop offset="0.24" style="stop-color:#575757"/>
	<stop offset="0.3" style="stop-color:#3B3B3B"/>
	<stop offset="0.36" style="stop-color:#252525"/>
	<stop offset="0.43" style="stop-color:#141414"/>
	<stop offset="0.52" style="stop-color:#090909"/>
	<stop offset="0.65" style="stop-color:#020202"/>
	<stop offset="1" style="stop-color:#000000"/>
</linearGradient>
<linearGradient id="steelD" gradientUnits="userSpaceOnUse" x1="0" y1="230" x2="0" y2="320">
	<stop offset="0.06" style="stop-color:#0D0D0D"/>
	<stop offset="0.12" style="stop-color:#8A8A8A"/>
	<stop offset="0.2" style="stop-color:#C8C8C8"/>
	<stop offset="0.35" style="stop-color:#6E6E6E"/>
	<stop offset="0.6" style="stop-color:#2B2B2B"/>
	<stop offset="1" style="stop-color:#000000"/>
</linearGradient>
</defs>
<!-- Sol -->
<rect x="30" y="432" width="440" height="8" rx="4" fill="#1A1A1A"/>
<!-- Colonne de charge (derriere le dossier) -->
<rect x="356" y="110" width="10" height="322" rx="4" fill="url(#steelV)"/>
<rect x="436" y="110" width="10" height="322" rx="4" fill="url(#steelV)"/>
<rect x="346" y="98" width="110" height="14" rx="6" fill="#111111"/>
<g fill="url(#steelV)">
	<rect x="352" y="250" width="98" height="15" rx="4"/>
	<rect x="352" y="268" width="98" height="15" rx="4"/>
	<rect x="352" y="286" width="98" height="15" rx="4"/>
	<rect x="352" y="304" width="98" height="15" rx="4"/>
	<rect x="352" y="322" width="98" height="15" rx="4"/>
	<rect x="352" y="340" width="98" height="15" rx="4"/>
	<rect x="352" y="358" width="98" height="15" rx="4"/>
	<rect x="352" y="376" width="98" height="15" rx="4"/>
	<rect x="352" y="394" width="98" height="15" rx="4"/>
	<rect x="352" y="412" width="98" height="15" rx="4"/>
</g>
<!-- Chassis : pied central + base -->
<rect x="150" y="416" width="220" height="12" rx="6" fill="#0D0D0D"/>
<rect x="236" y="352" width="14" height="66" rx="5" fill="url(#steelV)"/>
<!-- Dossier -->
<rect x="288" y="196" width="18" height="150" rx="9" fill="#0D0D0D"/>
<!-- Assise -->
<rect x="196" y="336" width="104" height="17" rx="8" fill="#0D0D0D"/>
<!-- Bras de levier machine : pivot haut derriere, poignee au niveau de la hanche -->
<path d="M330,214 L262,238 L246,300" stroke="url(#steelD)" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="330" cy="214" r="10" fill="#0D0D0D"/>
<!-- Poignee horizontale -->
<rect x="228" y="296" width="42" height="9" rx="4.5" fill="#0D0D0D"/>
<!-- Personnage : jambes (assis, cuisses horizontales) -->
<path d="M232,322 L156,326 L152,420" stroke="#EEEEEE" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<!-- Pied -->
<path d="M152,420 L134,424" stroke="#CCCCCC" stroke-width="13" fill="none" stroke-linecap="round"/>
<!-- Torse droit contre le dossier -->
<path d="M234,324 L244,218" stroke="#EEEEEE" stroke-width="34" fill="none" stroke-linecap="round"/>
<!-- Bras : epaule -> coude -> main sur la poignee (poussee vers le bas) -->
<path d="M244,228 L268,266 L254,298" stroke="#EEEEEE" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<!-- Tete -->
<circle cx="246" cy="186" r="23" fill="#CCCCCC"/>
<!-- Main -->
<circle cx="252" cy="300" r="10" fill="#CCCCCC"/>
</svg>
