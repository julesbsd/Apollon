<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="500px" height="500px" viewBox="0 0 500 500">
<!-- Pictogramme custom : Squat Smith machine (smith machine squat) — debout en position de squat, sous une barre guidee par deux montants verticaux -->
<defs>
<linearGradient id="steelV" gradientUnits="userSpaceOnUse" x1="170" y1="0" x2="345" y2="0">
	<stop offset="0.06" style="stop-color:#0D0D0D"/>
	<stop offset="0.09" style="stop-color:#999999"/>
	<stop offset="0.11" style="stop-color:#C8C8C8"/>
	<stop offset="0.15" style="stop-color:#9D9D9D"/>
	<stop offset="0.19" style="stop-color:#777777"/>
	<stop offset="0.24" style="stop-color:#575757"/>
	<stop offset="0.3" style="stop-color:#3B3B3B"/>
	<stop offset="0.36" style="stop-color:#252525"/>
	<stop offset="0.43" style="stop-color:#141414"/>
	<stop offset="0.52" style="stop-color:#090909"/>
	<stop offset="0.65" style="stop-color:#020202"/>
	<stop offset="1" style="stop-color:#000000"/>
</linearGradient>
<linearGradient id="steelH" gradientUnits="userSpaceOnUse" x1="0" y1="242" x2="0" y2="256">
	<stop offset="0.06" style="stop-color:#0D0D0D"/>
	<stop offset="0.12" style="stop-color:#8A8A8A"/>
	<stop offset="0.2" style="stop-color:#C8C8C8"/>
	<stop offset="0.35" style="stop-color:#6E6E6E"/>
	<stop offset="0.6" style="stop-color:#2B2B2B"/>
	<stop offset="1" style="stop-color:#000000"/>
</linearGradient>
</defs>
<!-- Sol -->
<rect x="30" y="432" width="440" height="8" rx="4" fill="#1A1A1A"/>
<!-- Base reliant les montants -->
<rect x="160" y="420" width="200" height="12" rx="6" fill="#0D0D0D"/>
<!-- Montants verticaux de guidage -->
<rect x="180" y="104" width="12" height="316" rx="5" fill="url(#steelV)"/>
<rect x="330" y="104" width="12" height="316" rx="5" fill="url(#steelV)"/>
<rect x="168" y="94" width="166" height="12" rx="6" fill="#111111"/>
<!-- Barre guidee -->
<rect x="176" y="243" width="160" height="10" rx="5" fill="url(#steelH)"/>
<!-- Disques de charge aux extremites -->
<rect x="170" y="224" width="14" height="48" rx="6" fill="url(#steelV)"/>
<rect x="330" y="224" width="14" height="48" rx="6" fill="url(#steelV)"/>
<!-- Personnage : jambes en flexion profonde -->
<path d="M256,332 L300,352 L296,418" stroke="#EEEEEE" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<!-- Pied -->
<path d="M296,418 L316,412" stroke="#CCCCCC" stroke-width="13" fill="none" stroke-linecap="round"/>
<!-- Torse legerement penche en avant, sous la barre -->
<path d="M256,336 L246,252" stroke="#EEEEEE" stroke-width="34" fill="none" stroke-linecap="round"/>
<!-- Bras : epaule -> coude -> main sur la barre -->
<path d="M250,258 L268,278 L284,252" stroke="#EEEEEE" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<!-- Tete -->
<circle cx="238" cy="224" r="23" fill="#CCCCCC"/>
<!-- Main sur la barre -->
<circle cx="285" cy="250" r="10" fill="#CCCCCC"/>
</svg>
