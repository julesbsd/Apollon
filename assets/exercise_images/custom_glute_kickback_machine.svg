<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="500px" height="500px" viewBox="0 0 500 500">
<!-- Pictogramme custom : Kickback fessier machine (glute kickback) — debout penche en appui, une jambe poussant une pedale vers l'arriere -->
<defs>
<linearGradient id="steelV" gradientUnits="userSpaceOnUse" x1="352" y1="0" x2="452" y2="0">
	<stop offset="0.06" style="stop-color:#0D0D0D"/>
	<stop offset="0.09" style="stop-color:#999999"/>
	<stop offset="0.11" style="stop-color:#C8C8C8"/>
	<stop offset="0.15" style="stop-color:#9D9D9D"/>
	<stop offset="0.19" style="stop-color:#777777"/>
	<stop offset="0.24" style="stop-color:#575757"/>
	<stop offset="0.3" style="stop-color:#3B3B3B"/>
	<stop offset="0.36" style="stop-color:#252525"/>
	<stop offset="0.43" style="stop-color:#141414"/>
	<stop offset="0.52" style="stop-color:#090909"/>
	<stop offset="0.65" style="stop-color:#020202"/>
	<stop offset="1" style="stop-color:#000000"/>
</linearGradient>
<linearGradient id="steelD" gradientUnits="userSpaceOnUse" x1="0" y1="300" x2="0" y2="360">
	<stop offset="0.06" style="stop-color:#0D0D0D"/>
	<stop offset="0.12" style="stop-color:#8A8A8A"/>
	<stop offset="0.2" style="stop-color:#C8C8C8"/>
	<stop offset="0.35" style="stop-color:#6E6E6E"/>
	<stop offset="0.6" style="stop-color:#2B2B2B"/>
	<stop offset="1" style="stop-color:#000000"/>
</linearGradient>
</defs>
<!-- Sol -->
<rect x="30" y="432" width="440" height="8" rx="4" fill="#1A1A1A"/>
<!-- Colonne de charge (a l'arriere de la machine) : montants -->
<rect x="356" y="110" width="10" height="322" rx="4" fill="url(#steelV)"/>
<rect x="436" y="110" width="10" height="322" rx="4" fill="url(#steelV)"/>
<rect x="346" y="98" width="110" height="14" rx="6" fill="#111111"/>
<!-- Pile de plaques -->
<g fill="url(#steelV)">
	<rect x="352" y="250" width="98" height="15" rx="4"/>
	<rect x="352" y="268" width="98" height="15" rx="4"/>
	<rect x="352" y="286" width="98" height="15" rx="4"/>
	<rect x="352" y="304" width="98" height="15" rx="4"/>
	<rect x="352" y="322" width="98" height="15" rx="4"/>
	<rect x="352" y="340" width="98" height="15" rx="4"/>
	<rect x="352" y="358" width="98" height="15" rx="4"/>
	<rect x="352" y="376" width="98" height="15" rx="4"/>
	<rect x="352" y="394" width="98" height="15" rx="4"/>
	<rect x="352" y="412" width="98" height="15" rx="4"/>
</g>
<!-- Appui poitrine sur montant vertical -->
<rect x="150" y="256" width="14" height="164" rx="6" fill="#0D0D0D"/>
<rect x="148" y="252" width="70" height="16" rx="8" fill="#0D0D0D"/>
<!-- Pedale arriere + bras de levier vers la colonne -->
<circle cx="320" cy="330" r="10" fill="#0D0D0D"/>
<path d="M320,330 L356,340" stroke="url(#steelD)" stroke-width="10" fill="none" stroke-linecap="round"/>
<rect x="330" y="336" width="30" height="12" rx="5" fill="#0D0D0D"/>
<!-- Personnage : jambe d'appui (verticale) -->
<path d="M250,300 L252,362 L250,420" stroke="#EEEEEE" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<!-- Pied d'appui -->
<path d="M250,420 L268,414" stroke="#CCCCCC" stroke-width="13" fill="none" stroke-linecap="round"/>
<!-- Jambe active poussant la pedale vers l'arriere -->
<path d="M250,300 L296,314 L338,336" stroke="#EEEEEE" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<!-- Pied sur la pedale -->
<path d="M338,336 L354,346" stroke="#CCCCCC" stroke-width="13" fill="none" stroke-linecap="round"/>
<!-- Torse penche en avant (quasi horizontal) -->
<path d="M250,300 L178,288" stroke="#EEEEEE" stroke-width="34" fill="none" stroke-linecap="round"/>
<!-- Bras : epaule -> coude -> main sur l'appui -->
<path d="M180,294 L192,326 L214,332" stroke="#EEEEEE" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<!-- Tete -->
<circle cx="158" cy="280" r="23" fill="#CCCCCC"/>
<!-- Main -->
<circle cx="216" cy="332" r="10" fill="#CCCCCC"/>
</svg>
